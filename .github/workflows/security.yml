name: Security Scanning & CI

on:
  push:
    branches: [ main, master, illumioexplorer_v1 ]
  pull_request:
    branches: [ main, master, illumioexplorer_v1 ]

jobs:
  security-audit:
    name: Dependency & SAST Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit flake8

      - name: Run pip-audit (Software Composition Analysis)
        run: |
          pip-audit -r requirements-web.txt

      - name: Run Bandit (Static Application Security Testing)
        run: |
          bandit -r app/ -ll -ii --exclude app/ui/

      - name: Python Syntax Compilation Check
        run: |
          python -m compileall app/

      - name: Install Dependencies for Test Suite
        run: |
          pip install -r requirements.txt -r requirements-web.txt pytest

      - name: Run Full Test Suite
        run: |
          pytest -v tests/
        env:
          PYTHONPATH: .
