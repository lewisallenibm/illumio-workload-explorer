<div class="table-wrap"><table><thead><tr><th>Hostname</th><th>Application</th><th>Role</th><th>Environment</th><th>Location</th><th>Region</th><th>VEN Installed</th></tr></thead><tbody>{% for row in rows %}<tr><td><button type="button" class="detail-link link-btn" data-panel-url="/cmdb/{{ row.hostname | urlencode }}/panel">{{ row.hostname or '—' }}</button></td><td>{{ row.cmdb_app or '—' }}</td><td>{{ row.cmdb_role or '—' }}</td><td>{{ row.cmdb_env or '—' }}</td><td>{{ row.cmdb_loc or '—' }}</td><td>{{ row.region or '—' }}</td><td>{{ row.ven_installed or '—' }}</td></tr>{% else %}<tr><td colspan="7">No saved CMDB data matches this query.</td></tr>{% endfor %}</tbody></table></div>
