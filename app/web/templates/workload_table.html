<div class="table-wrap"><table><thead><tr><th>Hostname</th><th>Online</th><th>Enforcement</th><th>VEN</th><th>OS</th></tr></thead><tbody>{% for row in rows %}<tr><td><button type="button" class="detail-link link-btn" data-panel-url="/workloads/{{ row.id }}/panel">{{ row.hostname or row.name or '—' }}</button></td><td>{{ 'Yes' if row.online else 'No' if row.online is not none else '—' }}</td><td>{{ row.enforcement_mode or '—' }}</td><td>{{ row.ven_version or '—' }}</td><td>{{ row.os or '—' }}</td></tr>{% else %}<tr><td colspan="5">No saved workload data matches this query.</td></tr>{% endfor %}</tbody></table></div>
