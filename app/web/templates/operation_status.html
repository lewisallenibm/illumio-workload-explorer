{% if operation %}<section class="operation-status {% if operation.status == 'FAILED' %}operation-failed{% endif %}" data-operation-id="{{ operation.id }}"><strong>{{ operation.label }}</strong><span data-operation-message>{{ operation.message }}</span><progress data-operation-progress {% if operation.progress_total %}max="{{ operation.progress_total }}" value="{{ operation.progress_current }}"{% else %}class="indeterminate"{% endif %}></progress><span data-operation-percent>{% if operation.progress_total %}{{ ((operation.progress_current / operation.progress_total) * 100)|round|int }}%{% else %}Working…{% endif %}</span>{% if operation.error %}<span class="error">{{ operation.error }}</span>{% endif %}</section>{% endif %}
